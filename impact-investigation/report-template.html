<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --accent: #1f4e8c;
    --accent-light: #e8eef7;
    --accent-border: #c7d5ea;
    --text: #1f2328;
    --muted: #5b6470;
    --rule: #d0d7e2;
    --stripe: #f8fafc;
    --code-bg: #f3f5f8;
    --code-border: #e3e8ef;
    --critical: #a8201a;
    --critical-bg: #fbeaea;
    --critical-border: #e9b8b5;
    --high: #b4470c;
    --high-bg: #fdf0e7;
    --high-border: #f0c6a8;
    --medium: #876a00;
    --medium-bg: #fbf5dc;
    --medium-border: #e8d99a;
    --low: #5b6470;
    --low-bg: #f1f3f6;
    --low-border: #d6dbe2;
    --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @page {
    size: A4;
    margin: 18mm 16mm;
    @bottom-center {
      content: counter(page) " / " counter(pages);
      font-family: var(--font);
      font-size: 8pt;
      color: #5b6470;
    }
    @bottom-right {
      content: "{{FOOTER_NOTE}}";
      font-family: var(--font);
      font-size: 8pt;
      color: #5b6470;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: var(--font);
    font-size: 10pt;
    line-height: 1.7;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header.cover {
    border-top: 6px solid var(--accent);
    border-bottom: 1px solid var(--rule);
    padding: 14px 0 12px;
    margin-bottom: 18px;
  }
  header.cover .kicker {
    color: var(--accent);
    font-size: 8.5pt;
    font-weight: 600;
    letter-spacing: 0.08em;
    margin: 0 0 4px;
  }
  header.cover h1 {
    font-size: 17pt;
    line-height: 1.4;
    font-weight: 700;
    margin: 0 0 10px;
  }
  header.cover .subtitle {
    font-size: 11pt;
    font-weight: 600;
    color: var(--muted);
    margin: -6px 0 12px;
  }
  header.cover dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 2px 14px;
    margin: 0;
    font-size: 8.5pt;
    color: var(--muted);
  }
  header.cover dt { font-weight: 600; }
  header.cover dd { margin: 0; }
  .counts {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin: 0 0 14px;
  }
  .count {
    border: 1px solid var(--rule);
    border-top-width: 4px;
    border-radius: 4px;
    padding: 6px 10px;
    break-inside: avoid;
  }
  .count .label { font-size: 8pt; font-weight: 700; letter-spacing: 0.02em; }
  .count .num { font-size: 16pt; font-weight: 700; line-height: 1.3; }
  .count-critical { border-top-color: var(--critical); }
  .count-critical .label { color: var(--critical); }
  .count-high { border-top-color: var(--high); }
  .count-high .label { color: var(--high); }
  .count-medium { border-top-color: var(--medium); }
  .count-medium .label { color: var(--medium); }
  .count-low { border-top-color: var(--low); }
  .count-low .label { color: var(--low); }
  section.summary {
    background: var(--accent-light);
    border: 1px solid var(--accent-border);
    border-radius: 4px;
    padding: 4px 16px 10px;
    margin-bottom: 8px;
  }
  section.summary h2 {
    border-left: none;
    padding-left: 0;
    margin-top: 10px;
  }
  h2 {
    font-size: 12pt;
    color: var(--accent);
    border-left: 4px solid var(--accent);
    padding: 1px 0 1px 9px;
    margin: 22px 0 8px;
    break-after: avoid;
  }
  h3 {
    font-size: 10.5pt;
    color: var(--text);
    margin: 16px 0 6px;
    break-after: avoid;
  }
  p { margin: 6px 0; }
  ul, ol { margin: 6px 0; padding-left: 1.4em; }
  li { margin: 2px 0; }
  li > ul, li > ol { margin: 2px 0; }
  strong { font-weight: 700; }
  a { color: var(--accent); text-decoration: none; }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 3px;
    padding: 0 3px;
    word-break: break-all;
  }
  .table-scroll {
    overflow-x: auto;
    margin: 8px 0 10px;
  }
  table {
    width: 100%;
    min-width: 640px;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 8.5pt;
    line-height: 1.55;
  }
  th {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    text-align: left;
    padding: 6px 8px;
  }
  td {
    border-bottom: 1px solid var(--rule);
    padding: 7px 8px;
    vertical-align: top;
  }
  tr { break-inside: avoid; }
  tbody tr:nth-child(even) td { background: var(--stripe); }
  table.impact th:first-child { width: 11%; }
  td code {
    background: none;
    border: none;
    padding: 0;
    color: #2b3a55;
    word-break: normal;
    overflow-wrap: anywhere;
    font-size: 0.9em;
  }
  .sev {
    display: inline-block;
    font-size: 7.5pt;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 3px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .sev-critical { color: var(--critical); background: var(--critical-bg); border: 1px solid var(--critical-border); }
  .sev-high { color: var(--high); background: var(--high-bg); border: 1px solid var(--high-border); }
  .sev-medium { color: var(--medium); background: var(--medium-bg); border: 1px solid var(--medium-border); }
  .sev-low { color: var(--low); background: var(--low-bg); border: 1px solid var(--low-border); }
  @media print {
    body { font-size: 9.5pt; }
    main { max-width: none; padding: 0; }
    .table-scroll { overflow: visible; }
    table { min-width: 0; }
  }
</style>
</head>
<body>
<main>
<header class="cover">
  <p class="kicker">{{KICKER}}</p>
  <h1>{{TITLE}}</h1>
  <p class="subtitle">{{SUBTITLE}}</p>
  <dl>
{{META_ROWS}}
  </dl>
</header>
<div class="counts">
  <div class="count count-critical"><div class="label">Critical</div><div class="num">{{COUNT_CRITICAL}}</div></div>
  <div class="count count-high"><div class="label">High</div><div class="num">{{COUNT_HIGH}}</div></div>
  <div class="count count-medium"><div class="label">Medium</div><div class="num">{{COUNT_MEDIUM}}</div></div>
  <div class="count count-low"><div class="label">Low</div><div class="num">{{COUNT_LOW}}</div></div>
</div>
{{SUMMARY}}
{{BODY}}
</main>
</body>
</html>
